[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insitugame"
version = "1.0.0"
description = "In Situ Spatial Evolutionary Game Assay for Inferring Tumor Subclonal Payoff Matrices and Adaptive Therapy Regimens"
readme = "README.md"
authors = [
  { name = "Luca Celebrano", email = "luca.celebrano1@gmail.com" }
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.4"
]

[project.urls]
"Homepage" = "https://github.com/Lukecele/spatial-game-assay"
"Bug Tracker" = "https://github.com/Lukecele/spatial-game-assay/issues"
"Documentation" = "https://github.com/Lukecele/spatial-game-assay#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["insitugame*"]
